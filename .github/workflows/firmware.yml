name: Horizon Cooler Firmware CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 core
        run: |
          arduino-cli core install esp32:esp32@3.2.0

      - name: Install WS2812FX
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "WS2812FX"

      - name: Detect firmware version
        id: version
        shell: bash
        run: |
          SKETCH="$(find . -maxdepth 1 -type f -name '*.ino' | head -n 1)"

          if [ -z "$SKETCH" ]; then
            echo "No .ino firmware source found"
            exit 1
          fi

          VERSION="$(grep -oP '#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"\K[^"]+' "$SKETCH" | head -n 1)"

          if [ -z "$VERSION" ]; then
            echo "FIRMWARE_VERSION not found"
            exit 1
          fi

          echo "sketch=$SKETCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Sketch : $SKETCH"
          echo "Version: $VERSION"

      - name: Compile ESP32-C3
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3 \
            --export-binaries \
            --build-path build \
            --warnings all \
            "${{ steps.version.outputs.sketch }}"

      - name: Validate OTA binary
        id: binary
        shell: bash
        run: |
          BIN="$(find build -type f -name '*.ino.bin' | head -n 1)"

          if [ -z "$BIN" ]; then
            echo "Compiled .bin not found"
            exit 1
          fi

          SIZE="$(stat -c%s "$BIN")"

          if [ "$SIZE" -le 0 ]; then
            echo "Binary is empty"
            exit 1
          fi

          FIRST_BYTE="$(xxd -p -l 1 "$BIN")"

          if [ "$FIRST_BYTE" != "e9" ]; then
            echo "Invalid ESP32 image header: $FIRST_BYTE"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          OUT="Horizon-Cooler-${VERSION}.bin"

          cp "$BIN" "$OUT"

          SHA256="$(sha256sum "$OUT" | awk '{print $1}')"

          echo "binary=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "Binary : $OUT"
          echo "Size   : $SIZE"
          echo "SHA256 : $SHA256"

      - name: Check release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LATEST="$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty')"

          if [ -z "$LATEST" ]; then
            echo "No previous firmware release found."
            exit 0
          fi

          python3 - <<'PY'
          import os
          import re
          import sys

          current = os.environ["VERSION"]
          latest = os.environ["LATEST"]

          def parse(v):
              m = re.fullmatch(r"V(\d+)\.(\d+)", v)
              if not m:
                  raise SystemExit(f"Invalid version: {v}")
              return int(m.group(1)), int(m.group(2))

          if parse(current) <= parse(latest):
              raise SystemExit(
                  f"Firmware version {current} must be greater than {latest}"
              )

          print(f"Version check OK: {latest} -> {current}")
          PY

      - name: Generate latest.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.binary.outputs.sha256 }}
          SIZE: ${{ steps.binary.outputs.size }}
          COMMIT: ${{ github.sha }}
        run: |
          TAG="firmware-${VERSION}"
          ASSET="Horizon-Cooler-${VERSION}.bin"

          python3 - <<PY
          import json

          data = {
              "product": "Horizon Cooler",
              "version": "${VERSION}",
              "tag": "${TAG}",
              "board": "ESP32-C3 Super Mini",
              "asset": "${ASSET}",
              "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}",
              "sha256": "${SHA256}",
              "size": int("${SIZE}"),
              "commit": "${COMMIT}"
          }

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\\n")
          PY

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BINARY: ${{ steps.binary.outputs.binary }}
        run: |
          TAG="firmware-${VERSION}"

          gh release create "$TAG" \
            "$BINARY" \
            "latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Horizon Cooler ${VERSION}" \
            --generate-notes

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: |
            Horizon-Cooler-${{ steps.version.outputs.version }}.bin
            latest.json
